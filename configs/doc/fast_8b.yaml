# NanoVDR-D-Fast: two 448x448 tiles plus a thumbnail, aligned to the full
# 4096-d output of the 8B teacher. A 3x smaller visual-token budget than HiRes, 1.76 average NDCG@5 lower.
visual_encoder: OpenGVLab/InternViT-300M-448px-V2_5
text_backbone:  answerdotai/ModernBERT-base
embed_dim:      4096
pool_type:      mean

tile_min_num:      1
tile_max_num:      2
tile_max_total:    3          # 2 tiles + thumbnail -> 3 x 1024 = 3072 patch tokens
tile_use_thumbnail: true

align: cosine

sources:
  - path:    ${DATA_ROOT}/base_711k
    targets: ${CACHE_ROOT}/teacher_8b/base_711k.h5
    upsample: 1
  - path:    ${DATA_ROOT}/multidomain_454k
    targets: ${CACHE_ROOT}/teacher_8b/multidomain_454k.h5
    upsample: 1
  - path:    ${DATA_ROOT}/finance_32k
    targets: ${CACHE_ROOT}/teacher_8b/finance_32k.h5
    upsample: 1
val_sources:
  - path:    ${DATA_ROOT}/val
    targets: ${CACHE_ROOT}/teacher_8b/val.h5

# effective batch = batch_size x grad_accum x world_size = 16 x 8 x 2 = 256
batch_size:  16
grad_accum:  8
epochs:      3
peak_lr:     1.0e-3
warmup_pct:  0.03
visual_lr_scale: 0.033        # the pretrained visual encoder moves slowly
num_workers: 16
output_dir:  outputs/nanovdr-d-fast
