# Single-vector query tower, distilled from the 8B teacher. Pairs with the
# NanoVDR-D document towers, which target the same 4096-d space.
backbone:    distilbert/distilbert-base-uncased
embed_dim:   4096
geometry:    single
pool_type:   mean
max_length:  512

# Must match the instruction used when the teacher targets were cached.
instruction: "Find a document image that matches the given query."

align: cosine

sources:
  - path:    ${DATA_ROOT}/queries_combined
    targets: ${CACHE_ROOT}/teacher_8b/queries_combined.h5
val_sources:
  - path:    ${DATA_ROOT}/queries_val
    targets: ${CACHE_ROOT}/teacher_8b/queries_val.h5

batch_size:  512
grad_accum:  1
epochs:      15
peak_lr:     5.0e-4           # 1e-3 diverges at peak with a fresh projection head
warmup_pct:  0.03
num_workers: 8
output_dir:  outputs/nanovdr-q-distilbert
